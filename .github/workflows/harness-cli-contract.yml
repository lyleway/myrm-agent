name: Harness CLI contract

# The real claude, codex, gemini, qwen and opencode binaries are the contract of the delegation runtime: the flags and
# values it passes, the handshake it sends, the frames it reads. They release on their own schedule, so the checks run
# against their latest releases: on every pull request and push to main that touches what the runtime sends them,
# weekly, on demand, and before every harness release (harness-publish.yml calls this workflow; its wheels are not
# uploaded while it is red). Codex is also run at the oldest version the runtime accepts, read from the code that
# refuses older ones, so what is tested and what is accepted cannot drift apart. The checks that need no model gate
# everything. The real turns need provider credentials:
# they run where the repository has CONTRACT_*_API_KEY secrets (dedicated keys with a provider-side spend limit) and
# say so in the run when it has none, so a green run never passes for one that talked to a model.

on:
  pull_request:
    paths:
      - 'myrm-agent-harness/src/myrm_agent_harness/toolkits/acp/**'
      - 'myrm-agent-harness/tests/toolkits/acp/**'
      - '.github/workflows/harness-cli-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'myrm-agent-harness/src/myrm_agent_harness/toolkits/acp/**'
      - 'myrm-agent-harness/tests/toolkits/acp/**'
      - '.github/workflows/harness-cli-contract.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  workflow_call:
    secrets:
      CONTRACT_ANTHROPIC_API_KEY:
        required: false
      CONTRACT_OPENAI_API_KEY:
        required: false
      CONTRACT_GEMINI_API_KEY:
        required: false

permissions:
  contents: read

# Called from a release the event is the caller's, so a release run is never cancelled by a pull request run.
concurrency:
  group: harness-cli-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: myrm-agent-harness

jobs:
  contract:
    name: Real binaries, no model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A binary that is not installed fails its tests instead of skipping them.
      MYRM_CONTRACT_REQUIRE_CLIS: claude,codex,gemini,qwen,opencode

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra all --group dev

      # The latest releases on purpose: the point is to notice when they stop behaving as the runtime expects. The
      # opencode 2.x line is published as release assets only, its npm package stops at 1.x.
      - name: Install the CLIs
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for attempt in 1 2 3; do "$@" && return 0; sleep $((attempt * 15)); done; return 1; }
          retry npm install --prefix cli @anthropic-ai/claude-code @openai/codex @google/gemini-cli @qwen-code/qwen-code
          tag=$(retry gh api 'repos/anomalyco/opencode/releases?per_page=30' --jq '[.[] | select((.prerelease | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | max_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber)) | .tag_name')
          retry curl -fsSL -o opencode.tar.gz "https://github.com/anomalyco/opencode/releases/download/${tag}/opencode-linux-x64.tar.gz"
          tar -xzf opencode.tar.gz -C cli/node_modules/.bin opencode
          echo "$PWD/cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show the CLI versions
        run: |
          {
            echo '### CLI versions under test'
            for cli in claude codex gemini qwen opencode; do
              echo "- ${cli}: $("$cli" --version 2>&1 | head -n 1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Codex runs every command of a turn inside a sandbox built from unprivileged user namespaces, which the
      # runner's AppArmor restricts: the tests that let Codex run commands need them allowed, as Codex's own CI does.
      # Each setting is changed only where the kernel has it.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the contract tests
        run: >-
          uv run --no-sync pytest -m integration -q --tb=short
          tests/toolkits/acp/test_real_cli_launch_contract.py
          tests/toolkits/acp/test_real_cli_account_home.py
          tests/toolkits/acp/runtime/cli/test_real_cli_argv_contract.py
          tests/toolkits/acp/runtime/cli/test_real_cli_login_contract.py
          tests/toolkits/acp/test_real_cli_login_flow.py
          tests/toolkits/acp/runtime/acp/test_real_acp_handshake.py
          tests/toolkits/acp/runtime/acp/test_real_acp_session_mode.py
          tests/toolkits/acp/runtime/acp/test_real_acp_permission_round_trip.py
          tests/toolkits/acp/runtime/acp/test_real_acp_session_continuity.py
          tests/toolkits/acp/runtime/cli/test_real_cli_contract.py
          tests/toolkits/acp/runtime/cli/test_real_cli_failures.py
          tests/toolkits/acp/runtime/cli/test_real_cli_images.py
          tests/toolkits/acp/runtime/cli/test_real_claude_permission_prompt.py
          tests/toolkits/acp/runtime/cli/test_real_claude_turn_end.py
          tests/toolkits/acp/runtime/cli/test_real_claude_sub_agent.py
          tests/toolkits/acp/runtime/codex/test_real_codex_protocol_contract.py
          tests/toolkits/acp/runtime/codex/test_real_codex_app_server.py
          tests/toolkits/acp/runtime/codex/test_real_codex_threads.py
          tests/toolkits/acp/test_real_http_mcp.py

  codex-floor:
    name: Codex at the oldest version the runtime accepts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MYRM_CONTRACT_REQUIRE_CLIS: codex

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Read the oldest Codex version the runtime accepts
        id: floor
        run: |
          version=$(uv run --no-sync python -c "from myrm_agent_harness.toolkits.acp.runtime.codex.protocol import MINIMUM_SERVER_VERSION as v; print('.'.join(map(str, v)))")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install that Codex
        working-directory: ${{ runner.temp }}
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          retry() { for attempt in 1 2 3; do "$@" && return 0; sleep $((attempt * 15)); done; return 1; }
          retry npm install --prefix cli "@openai/codex@${FLOOR}"
          echo "$PWD/cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show the Codex version
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          installed=$(codex --version 2>&1 | head -n 1)
          echo "### Codex under test: ${installed} (the oldest the runtime accepts: ${FLOOR})" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$installed" in *" ${FLOOR}") ;; *) echo "::error::Installed '${installed}', expected ${FLOOR}"; exit 1 ;; esac

      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the Codex contract tests
        run: >-
          uv run --no-sync pytest -m integration -q --tb=short
          tests/toolkits/acp/runtime/codex/test_real_codex_protocol_contract.py
          tests/toolkits/acp/runtime/codex/test_real_codex_app_server.py
          tests/toolkits/acp/runtime/codex/test_real_codex_threads.py

  real-turns:
    name: Real turns (provider credentials)
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.CONTRACT_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.CONTRACT_OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.CONTRACT_GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Only the CLIs that have a credential are installed: the tests skip a CLI that is not there, and one that is
      # there without a credential would fail on its first turn.
      - name: Pick the CLIs that have credentials
        id: pick
        run: |
          packages=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then packages="$packages @anthropic-ai/claude-code"; fi
          if [ -n "$OPENAI_API_KEY" ]; then packages="$packages @openai/codex"; fi
          if [ -n "$GEMINI_API_KEY" ]; then packages="$packages @google/gemini-cli"; fi
          echo "packages=${packages# }" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "::warning title=No real turn was run::No CONTRACT_ANTHROPIC_API_KEY, CONTRACT_OPENAI_API_KEY or CONTRACT_GEMINI_API_KEY secret is set, so no model was asked anything."
            echo '### No real turn was run: no CONTRACT_*_API_KEY secret is set' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install uv
        if: steps.pick.outputs.packages != ''
        uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0
        with:
          version: "0.12.7"

      - name: Set up Python
        if: steps.pick.outputs.packages != ''
        run: uv python install 3.13

      - name: Install dependencies
        if: steps.pick.outputs.packages != ''
        run: uv sync --python 3.13 --locked --extra all --group dev

      - name: Install the CLIs
        if: steps.pick.outputs.packages != ''
        working-directory: ${{ runner.temp }}
        run: |
          for attempt in 1 2 3; do
            npm install --prefix cli ${{ steps.pick.outputs.packages }} && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done
          echo "$PWD/cli/node_modules/.bin" >> "$GITHUB_PATH"

      # Each test asks a prompt of a few words with a turn limit; the spend limit of the key is the cap.
      - name: Run the real turns
        if: steps.pick.outputs.packages != ''
        run: uv run --no-sync pytest -m integration -q --tb=short -rs tests/toolkits/acp/test_real_integration.py
